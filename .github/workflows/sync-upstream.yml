name: Sync upstream main

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'hutaao/migu_AI_competition_Emotional_Companion_Dialogue_Model'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify fork parent and merge upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: hutaao/migu_AI_competition_Emotional_Companion_Dialogue_Model
          EXPECTED_UPSTREAM: Muelsyse516/migu_AI_competition_Emotional_Companion_Dialogue_Model
        shell: bash
        run: |
          set -euo pipefail

          parent="$(gh api "repos/$GH_REPO" --jq '.parent.full_name')"
          if [[ "$parent" != "$EXPECTED_UPSTREAM" ]]; then
            echo "::error::Fork parent differs from the approved upstream. Stopping."
            exit 1
          fi

          echo "Syncing upstream main into $GH_REPO:main"
          if ! gh api --method POST "repos/$GH_REPO/merge-upstream" \
            -H 'Accept: application/vnd.github+json' \
            -f branch=main; then
            echo "::error::Sync failed. Resolve conflicts or permissions manually; no force update is attempted."
            exit 1
          fi

          {
            echo '### Upstream synchronization completed'
            echo "- Source: $EXPECTED_UPSTREAM:main"
            echo "- Target: $GH_REPO:main"
            echo '- Mode: GitHub merge-upstream API; no force push.'
          } >> "$GITHUB_STEP_SUMMARY"
